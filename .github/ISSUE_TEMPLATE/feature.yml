name: Feature request
description: Propose a change or an addition.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
